name: Insights da horta

# Três execuções por dia (horários em UTC; o Brasil está em UTC-3, sem horário de verão):
#   10:40 UTC = 07:40 em Brasília  (insights da manhã)
#   17:40 UTC = 14:40 em Brasília  (insights da tarde)
#   00:40 UTC = 21:40 em Brasília  (balanço da noite)
# Minutos "quebrados" de propósito: o GitHub atrasa muito os agendamentos de :00, :15, :30 e :45.
# Se mudar um horário, mude também TURNO_POR_AGENDAMENTO em insights/gerar_insights.py.
on:
  schedule:
    - cron: '40 10 * * *'
    - cron: '40 17 * * *'
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      turno:
        description: 'Turno (vazio = pelo horário)'
        required: false
        type: choice
        options: ['', manha, tarde, noite]

concurrency:
  group: insights-horta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar insights
        run: python insights/gerar_insights.py
        env:
          INSIGHTS_EMAIL: ${{ secrets.INSIGHTS_EMAIL }}
          INSIGHTS_SENHA: ${{ secrets.INSIGHTS_SENHA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HORTA_LAT: ${{ secrets.HORTA_LAT }}
          HORTA_LON: ${{ secrets.HORTA_LON }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TURNO: ${{ inputs.turno }}
          SCHEDULE: ${{ github.event.schedule }}
